<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ren's Anime Canvas</title>
    <style>
        :root {
            --bg-color: #f0f0f0;
            --panel-bg: #ffffff;
            --outline-color: #000000;
            --font-main: 'Patrick Hand', 'Comic Sans MS', cursive, sans-serif;
        }
        body { margin: 0; padding: 0; background-color: var(--bg-color); font-family: var(--font-main); overflow: hidden; }
        .game-container { display: flex; height: 100vh; }
        .sidebar { width: 300px; background: var(--panel-bg); padding: 20px; border-right: 4px solid var(--outline-color); display: flex; flex-direction: column; gap: 20px; box-shadow: 5px 0 15px rgba(0,0,0,0.1); }
        .logo { font-size: 2.5rem; margin: 0; text-transform: uppercase; border-bottom: 2px solid black; padding-bottom: 10px; }
        .subtitle { font-size: 1rem; color: #555; }
        .panel { background: #f9f9f9; padding: 15px; border: 2px solid #ddd; border-radius: 8px; }
        h3 { margin-top: 0; border-bottom: 1px dashed #aaa; padding-bottom: 5px; }
        .expression-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .expr-btn { padding: 8px; cursor: pointer; background: white; border: 2px solid #333; border-radius: 4px; font-family: var(--font-main); transition: transform 0.1s; }
        .expr-btn:active { transform: scale(0.95); }
        label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: bold; }
        input[type="color"] { border: 2px solid #333; width: 40px; height: 30px; cursor: pointer; }
        .action-btn { width: 100%; padding: 12px; margin-bottom: 10px; background: #333; color: white; border: none; font-family: var(--font-main); font-size: 1.1rem; cursor: pointer; }
        .action-btn:hover { background: #555; }
        .stage { flex-grow: 1; display: flex; justify-content: center; align-items: center; position: relative; background-image: radial-gradient(#e0e0e0 1px, transparent 1px); background-size: 20px 20px; }
        .paper-texture { background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.2); padding: 10px; border-radius: 2px; }
        canvas { width: 100%; height: auto; display: block; background: transparent; }
        .ui-overlay { position: absolute; top: 20px; left: 20px; font-size: 1.5rem; font-weight: bold; text-shadow: 2px 2px 0 #fff; }
        @media (max-width: 768px) {
            .game-container { flex-direction: column; }
            .sidebar { width: 100%; height: auto; max-height: 40vh; overflow-y: auto; }
            .stage { height: 60vh; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <aside class="sidebar">
            <h1 class="logo">REN <span class="subtitle">BUILDER</span></h1>
            <div class="panel">
                <h3>Expression Matrix</h3>
                <div class="expression-grid">
                    <button class="expr-btn" onclick="setExpression('happy')">Happy</button>
                    <button class="expr-btn" onclick="setExpression('sad')">Sad</button>
                    <button class="expr-btn" onclick="setExpression('angry')">Angry</button>
                    <button class="expr-btn" onclick="setExpression('surprised')">Surprised</button>
                    <button class="expr-btn" onclick="setExpression('determined')">Determined</button>
                    <button class="expr-btn" onclick="setExpression('shy')">Shy</button>
                </div>
            </div>
            <div class="panel">
                <h3>Materials (Config)</h3>
                <label>Hair & Eyes <input type="color" id="mat-hair" value="#2C3E50" oninput="updateMaterial('hair', this.value)"></label>
                <label>Skin <input type="color" id="mat-skin" value="#FDEBD0" oninput="updateMaterial('skin', this.value)"></label>
                <label>Kimono <input type="color" id="mat-ki" value="#F4F6F7" oninput="updateMaterial('kimono', this.value)"></label>
                <label>Sash <input type="color" id="mat-sash" value="#3498DB" oninput="updateMaterial('sash', this.value)"></label>
            </div>
            <div class="panel">
                <h3>Game Actions</h3>
                <button id="draw-btn" class="action-btn">✎ Sketch Mode</button>
                <button id="reset-btn" class="action-btn">↺ Reset Config</button>
            </div>
        </aside>
        <main class="stage">
            <div class="paper-texture">
                <canvas id="gameCanvas" width="800" height="600"></canvas>
            </div>
            <div class="ui-overlay">
                <span>HP: 100%</span> | <span>MP: 50%</span>
            </div>
        </main>
    </div>

    <script>
        // CHARACTER CONFIGURATION
        const characterConfig = {
            name: "Ren",
            materials: {
                hair: "#2C3E50",
                skin: "#FDEBD0",
                kimono: "#F4F6F7",
                sash: "#3498DB",
                outline: "#000000"
            }
        };
        let currentExpression = 'happy';
        let isSketchMode = false;
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // RENDER ENGINE
        function drawCharacter() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(400, 300);

            // Kimono Body
            ctx.fillStyle = characterConfig.materials.kimono;
            ctx.strokeStyle = characterConfig.materials.outline;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(-40, -20);
            ctx.lineTo(40, -20);
            ctx.lineTo(60, 150);
            ctx.lineTo(-60, 150);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Sash
            ctx.fillStyle = characterConfig.materials.sash;
            ctx.fillRect(-45, 20, 90, 30);
            ctx.strokeRect(-45, 20, 90, 30);
            ctx.beginPath();
            ctx.arc(0, 35, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Head & Neck
            ctx.fillStyle = characterConfig.materials.skin;
            ctx.fillRect(-10, -40, 20, 20);
            ctx.beginPath();
            ctx.ellipse(0, -70, 45, 50, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Hair
            ctx.fillStyle = characterConfig.materials.hair;
            ctx.beginPath();
            ctx.moveTo(-50, -70); ctx.lineTo(50, -70); ctx.lineTo(55, -40);
            ctx.lineTo(40, -50); ctx.lineTo(20, -30); ctx.lineTo(0, -50);
            ctx.lineTo(-20, -30); ctx.lineTo(-40, -50); ctx.lineTo(-55, -40);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-45, -70); ctx.lineTo(-20, -50); ctx.lineTo(0, -65);
            ctx.lineTo(20, -50); ctx.lineTo(45, -70); ctx.lineTo(45, -80);
            ctx.lineTo(-45, -80);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            drawFaceDetails();
            ctx.restore();
        }

        function drawFaceDetails() {
            ctx.fillStyle = characterConfig.materials.hair;
            if (currentExpression === 'surprised') {
                ctx.beginPath(); ctx.arc(-20, -70, 8, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(20, -70, 8, 0, Math.PI*2); ctx.fill();
            } else if (currentExpression === 'angry' || currentExpression === 'determined') {
                ctx.beginPath(); ctx.moveTo(-30, -75); ctx.lineTo(-10, -65); ctx.lineTo(-30, -65); ctx.fill();
                ctx.beginPath(); ctx.moveTo(30, -75); ctx.lineTo(10, -65); ctx.lineTo(30, -65); ctx.fill();
            } else {
                ctx.beginPath(); ctx.arc(-20, -70, 6, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(20, -70, 6, 0, Math.PI*2); ctx.fill();
                if(currentExpression === 'shy') {
                    ctx.fillStyle = "rgba(255, 100, 100, 0.3)";
                    ctx.beginPath(); ctx.arc(-25, -60, 10, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(25, -60, 10, 0, Math.PI*2); ctx.fill();
                }
            }
            ctx.beginPath();
            ctx.lineWidth = 3;
            if (currentExpression === 'happy' || currentExpression === 'shy') {
                ctx.arc(0, -50, 10, 0, Math.PI);
            } else if (currentExpression === 'sad' || currentExpression === 'angry') {
                ctx.moveTo(-10, -40); ctx.lineTo(10, -40);
            } else if (currentExpression === 'surprised') {
                ctx.arc(0, -50, 5, 0, Math.PI*2);
            } else {
                ctx.moveTo(-5, -50); ctx.lineTo(5, -50);
            }
            ctx.stroke();
        }

        // INTERACTIONS
        window.setExpression = function(exprName) {
            currentExpression = exprName;
            drawCharacter();
        };

        window.updateMaterial = function(type, color) {
            characterConfig.materials[type] = color;
            drawCharacter();
        };

        document.getElementById('draw-btn').addEventListener('click', () => {
            isSketchMode = !isSketchMode;
            const btn = document.getElementById('draw-btn');
            btn.innerText = isSketchMode ? "✎ Sketch Mode: ON" : "✎ Sketch Mode";
            btn.style.background = isSketchMode ? "#e74c3c" : "#333";
            if(isSketchMode) requestAnimationFrame(animateSketch);
        });

        function animateSketch() {
            if(!isSketchMode) return;
            ctx.strokeStyle = "#333";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
            ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
            ctx.stroke();
            drawCharacter();
            requestAnimationFrame(animateSketch);
        }

        document.getElementById('reset-btn').addEventListener('click', () => location.reload());

        // INIT
        drawCharacter();
    </script>
</body>
</html>
